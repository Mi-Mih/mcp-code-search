# Формат размеченного набора для `harness.py` — и одновременно рабочий пример:
# запросы здесь размечены по коду самого code-search, поэтому набор запускается
# без сторонних проектов (проиндексируйте этот каталог и укажите его как root).
#
#   query   — формулировка обычным языком, как её задал бы человек
#   expect  — путь к файлу или каталогу; достаточно одного заведомо верного.
#             Путь с завершающим "/" означает «где угодно внутри», без него —
#             ровно этот файл. Пути относительно корня индексируемого проекта.
#   kind    — concept | domain | docs | test | exact
#
# Разметка своего набора — единственная работа, которую нельзя ни у кого взять:
# числа привязаны к проекту и к тому, что в нём считается верным ответом. Наборы,
# по которым сняты числа в README и PLAN, были размечены по закрытому проекту и в
# репозиторий не входят; воспроизводятся не они, а методика.
#
# Виды нужны не для отчётности, а для гейта: он смотрит только на concept —
# запросы, на которые грепом не ответить. Выигрыш на exact ничего не доказывал бы,
# потому что там греп и так лучше.

- query: "как определяются границы чанков в markdown"
  expect: ["code_search/chunker.py"]
  kind: concept

- query: "почему id чанка не выдаётся повторно"
  expect: ["code_search/store.py"]
  kind: concept

- query: "слияние двух списков результатов по обратным рангам"
  expect: ["code_search/search.py"]
  kind: domain

- query: "как обновить индекс после смены модели"
  expect: ["README.md", "SETUP.md"]
  kind: docs

- query: "проверка, что чанки покрывают файл без пропусков"
  expect: ["tests/test_chunker.py"]
  kind: test

- query: "CHUNKER_VERSION"
  expect: ["code_search/chunker.py"]
  kind: exact
